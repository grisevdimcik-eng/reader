<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c6b52">
<link rel="manifest" href="manifest.webmanifest">
<title>Читалка</title>
<style>
:root{--bg:#f5f6f3;--surface:#fff;--fg:#1c2421;--muted:#68726d;--line:#dfe3dd;--accent:#2c6b52;--accent-fg:#fff;--read-size:19px;--lh:1.7;--width:38rem}
:root[data-theme=sepia]{--bg:#efe6d2;--surface:#f7efdd;--fg:#3a3024;--muted:#7d6e57;--line:#dccfb4;--accent:#8a4f1d;--accent-fg:#fff8ec}
:root[data-theme=dark]{--bg:#111416;--surface:#1a1e21;--fg:#d7dbd8;--muted:#8c9691;--line:#2a3034;--accent:#7cc4a2;--accent-fg:#0d1512}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);line-height:1.5}button,input{font:inherit;color:inherit}button{cursor:pointer}.bar{position:sticky;top:0;z-index:5;height:54px;display:flex;align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}.host{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:14px}.ibtn{border:0;background:transparent;border-radius:10px;min-width:40px;height:40px}.ibtn:hover{background:var(--surface)}.progress{position:absolute;bottom:-1px;left:0;width:100%;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left}.home{max-width:40rem;margin:0 auto;padding:12vh 0 4rem}.home h1{font-family:Georgia,serif;font-size:clamp(2rem,8vw,2.9rem);line-height:1.1;margin:0 0 .6rem}.lead{color:var(--muted);font-size:1.08rem;margin:0 0 2rem}.form{display:flex;gap:8px;flex-wrap:wrap}.form input{flex:1 1 16rem;height:52px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.btn{height:52px;padding:0 24px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700}.err{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.recent{margin-top:3rem}.recent h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.recent ul{list-style:none;padding:0}.recent li{border-top:1px solid var(--line)}.recent a{display:flex;justify-content:space-between;gap:12px;padding:12px 0;color:inherit;text-decoration:none}.recent .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.recent .m{color:var(--muted);font-size:.9rem}.article{max-width:var(--width);margin:0 auto;padding:36px 0 7rem;font-family:Georgia,"Times New Roman",serif;font-size:var(--read-size);line-height:var(--lh);overflow-wrap:break-word}.article h1{font-size:1.75em;line-height:1.2;margin:0 0 .5em}.meta{font-family:system-ui,sans-serif;color:var(--muted);font-size:.8em;display:flex;gap:6px 14px;flex-wrap:wrap;margin-bottom:2em}.body p{margin:0 0 1.1em}.body h2,.body h3,.body h4{line-height:1.25;margin:1.8em 0 .6em}.body a{color:var(--accent)}.body img{display:block;max-width:100%;height:auto;margin:1.4em auto;border-radius:6px}.body blockquote{margin:1.4em 0;padding-left:1em;border-left:3px solid var(--line);color:var(--muted)}.body ul,.body ol{padding-left:1.4em}.body li{margin:.3em 0}.end{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line);font-family:system-ui,sans-serif;color:var(--muted)}.pager{display:flex;gap:10px;margin-top:2rem;font-family:system-ui,sans-serif}.pager button{flex:1;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.pager button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}.panel{position:fixed;z-index:20;top:62px;right:12px;width:min(22rem,calc(100vw - 24px));padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 12px 40px #0002;display:grid;gap:14px}.row{display:grid;gap:7px}.row label,.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{height:38px;border:0;border-right:1px solid var(--line);background:transparent}.seg button:last-child{border:0}.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);font-weight:700}input[type=range]{width:100%;accent-color:var(--accent)}[hidden]{display:none!important}.loading{text-align:center;color:var(--muted);padding-top:30vh}.status{font-family:system-ui,sans-serif;color:var(--muted);font-size:.9rem;margin-top:1rem}
</style></head><body>
<div class="bar" id="bar" hidden><button class="ibtn" id="back">←</button><div class="host" id="host"></div><button class="ibtn" id="gear">Aa</button><div class="progress" id="progress"></div></div>
<div class="panel" id="panel" hidden>
<div class="row"><span class="lbl">Тема</span><div class="seg" data-key="theme"><button data-v="light">Светлая</button><button data-v="sepia">Сепия</button><button data-v="dark">Тёмная</button><button data-v="auto">Авто</button></div></div>
<div class="row"><span class="lbl">Шрифт</span><div class="seg" data-key="font"><button data-v="serif">С засечками</button><button data-v="sans">Без засечек</button></div></div>
<div class="row"><label>Размер текста <span id="sizeV"></span></label><input id="size" type="range" min="15" max="30"></div>
<div class="row"><label>Интервал <span id="lhV"></span></label><input id="lh" type="range" min="1.4" max="2.1" step=".05"></div>
<div class="row"><span class="lbl">Ширина</span><div class="seg" data-key="width"><button data-v="narrow">Узкая</button><button data-v="mid">Средняя</button><button data-v="wide">Широкая</button></div></div>
</div>
<main class="home" id="home"><h1>Вставь ссылку и читай без мусора</h1><p class="lead">Читалка работает прямо в браузере, без собственного сервера. Если сайт разрешает запросы из браузера, текст будет извлечён автоматически.</p><form class="form" id="form"><input id="url" type="url" placeholder="https://сайт.com/глава-1" autocomplete="off"><button class="btn">Читать</button></form><div class="err" id="err" hidden></div><section class="recent" id="recent" hidden><h2>Недавнее</h2><ul id="recentList"></ul></section></main>
<div class="loading" id="loading" hidden>Загружаю страницу…</div>
<article class="article" id="article" hidden><header><h1 id="title"></h1><div class="meta" id="meta"></div></header><div class="body" id="body"></div><div class="pager" id="pager" hidden><button id="prev">← Предыдущая</button><button class="primary" id="next">Следующая →</button></div><div class="end" id="end"></div></article>
<script src="app.js"></script></body></html>
