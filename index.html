<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2933">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Читалка</title>
<style>
  :root { --fs: 19px; --bg: #fbf8f1; --fg: #222; --card: #fff; --line: #ddd; --accent: #2b6cb0; }
  body.dark { --bg: #14171a; --fg: #d7d7d7; --card: #1d2125; --line: #333; --accent: #63a4ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 12px; z-index: 5; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 10px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  button { padding: 10px 14px; font-size: 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; }
  button:disabled { opacity: .35; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  details { margin-top: 8px; }
  summary { font-size: 14px; opacity: .7; }
  .tools { display: flex; gap: 8px; margin-top: 8px; }
  #status { padding: 8px 14px; font-size: 14px; color: #c53030; }
  #reader { max-width: 720px; margin: 0 auto; padding: 8px 18px 24px; }
  #title { font-size: 15px; opacity: .6; margin: 8px 0; }
  #text p { font-family: Georgia, serif; font-size: var(--fs); line-height: 1.6; margin: 0 0 .8em; text-indent: 1.2em; }
  .nav { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 16px; }
  #pageinfo { font-size: 15px; opacity: .7; }
</style>
</head>
<body>
<header>
  <div class="row">
    <input id="url" type="url" placeholder="Ссылка на книгу loveread.ec" inputmode="url">
    <button id="go">Открыть</button>
  </div>
  <div class="tools">
    <button class="ghost" id="fminus">А−</button>
    <button class="ghost" id="fplus">А+</button>
    <button class="ghost" id="theme">☾</button>
  </div>
  <details id="settings">
    <summary>Настройки</summary>
    <div class="row" style="margin-top:8px">
      <input id="worker" type="url" placeholder="https://имя.аккаунт.workers.dev">
      <button id="saveworker">OK</button>
    </div>
  </details>
</header>
<div id="status"></div>
<main id="reader" hidden>
  <div id="title"></div>
  <div class="nav">
    <button id="prev">← Назад</button>
    <span id="pageinfo"></span>
    <button id="next">Следующая →</button>
  </div>
  <div id="text"></div>
  <div class="nav">
    <button id="prev2">← Назад</button>
    <button id="next2">Следующая →</button>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
